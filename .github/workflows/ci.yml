name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.9', timeout_minutes: 15}
          - {os: ubuntu-24.04, python: '3.13', timeout_minutes: 15}
          - {os: windows-2025, python: '3.13', timeout_minutes: 20}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Show runtime
        run: |
          python --version
          git --version
      - name: Run maintained checks (ordinary and optimized Python)
        run: python -B validation/run_checks.py --keep-artifacts
      - name: Check fixed guard-removal regressions
        if: matrix.python == '3.13'
        run: python -B validation/mutation_check.py
